<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='shield.png') }}">
    <meta charset="UTF-8">
    <title>Biometric Authorization System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; }
        .container { margin-top:10px; display: flex; flex-direction: column; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 500px; text-align: center; justify-content: center; align-items: center; }
        h1 { margin-bottom: 20px; }
        .camera-container {
            width: 20vw;
            height: 40vh;
            border: 2px solid #333;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .camera-container img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background: #4CAF50; color: white; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        .register-link { margin-top: 10px; display: block; color: #007BFF; cursor: pointer; text-decoration: underline; }
        .status { margin-top: 10px; color: red; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Biometric Authorization System</h1>

    <div class="camera-container">
        <img id="videoFeed" alt="Strumień wideo" />
    </div>

    <div id="face_status" style="font-size:20px; font-weight:bold;">
    </div>

    <input type="text" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <div class="status" id="status"></div>
    <span class="register-link" onclick="window.location.href='/register_view'">Don't have an account? Register</span>
</div>

<canvas id="hiddenCanvas" width="160" height="160" style="display:none;"></canvas>

<script>
    function startStream() {
        document.getElementById("videoFeed").src =
            "/video?ts=" + Date.now();
    }
    window.addEventListener("load", startStream);

    function updateFaceStatus() {
        fetch("/face_status")
            .then(r => r.json())
            .then(data => {
                const el = document.getElementById("face_status");
                if (data.face_detected) {
                    el.textContent = "Face detected";
                    el.style.color = "green";
                } else {
                    el.textContent = "Face not detected yet";
                    el.style.color = "red";
                }
            });
    }
    setInterval(updateFaceStatus, 500);

    const loginBtn = document.getElementById('loginBtn');
    const statusDiv = document.getElementById('status');

    loginBtn.addEventListener('click', () => {
        const emailValue = document.getElementById('email').value;
        const passwordValue = document.getElementById('password').value;

        if (!emailValue || !passwordValue) {
            statusDiv.innerText = "Please fill in all fields.";
            statusDiv.style.color = "red";
            return;
        }

        statusDiv.innerText = "Sprawdzanie konfiguracji konta...";
        statusDiv.style.color = "orange";

        // KROK 1: Sprawdzamy w bazie, czy użytkownik potrzebuje MFA (głos)
        fetch('/api/login-check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailValue, password: passwordValue })
        })
        .then(res => {
            if (!res.ok) {
                return res.json().then(data => { throw new Error(data.message || "Błędne dane logowania"); });
            }
            return res.json();
        })
        .then(preCheck => {
            if (!preCheck.valid) {
                throw new Error(preCheck.message || "Autoryzacja odrzucona");
            }

            // KROK 2: Sprawdzamy flagę require_voice z backendu
            if (preCheck.require_voice) {

                // === WARIANT A: GŁOS JEST WYMAGANY ===
                statusDiv.innerText = "Requesting microphone access...";
                statusDiv.style.color = "orange";

                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        const mediaRecorder = new MediaRecorder(stream);
                        const audioChunks = [];

                        mediaRecorder.addEventListener("dataavailable", event => {
                            audioChunks.push(event.data);
                        });

                        mediaRecorder.addEventListener("stop", () => {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                            const reader = new FileReader();
                            reader.readAsDataURL(audioBlob);

                            reader.onloadend = () => {
                                const base64Audio = reader.result;
                                // Wysyłamy dane z głosem
                                sendFinalLogin(emailValue, passwordValue, base64Audio);
                            };
                        });

                        mediaRecorder.start();
                        statusDiv.innerText = "Recording voice... Please speak now (3s).";
                        statusDiv.style.color = "purple";

                        setTimeout(() => {
                            mediaRecorder.stop();
                            stream.getTracks().forEach(track => track.stop());
                        }, 3000);
                    })
                    .catch(err => {
                        statusDiv.innerText = "Microphone error: " + err.message;
                        statusDiv.style.color = "red";
                    });

            } else {

                // === WARIANT B: GŁOS JEST WYŁĄCZONY ===
                statusDiv.innerText = "Autoryzacja uproszczona (Tylko Twarz). Przetwarzanie...";
                statusDiv.style.color = "blue";

                // Wysyłamy żądanie natychmiast, przekazując null zamiast audio
                sendFinalLogin(emailValue, passwordValue, null);
            }
        })
        .catch(err => {
            statusDiv.innerText = err.message;
            statusDiv.style.color = "red";
        });
    });

    // Funkcja pomocnicza wysyłająca ostateczne dane do endpointu /login
    function sendFinalLogin(email, password, audioData) {
        const payload = {
            email: email,
            password: password,
            audio: audioData // Może być string Base64 lub null
        };

        fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => {
            return res.json().then(data => {
                if (!res.ok) throw new Error(data.message || "Login failed");
                return data;
            });
        })
        .then(data => {
            statusDiv.innerText = data.message;
            statusDiv.style.color = "green";

            if (data.redirect) {
                setTimeout(() => {
                    window.location.href = data.redirect;
                }, 1000);
            }
        })
        .catch(err => {
            statusDiv.innerText = err.message;
            statusDiv.style.color = "red";
        });
    }
</script>
</body>
</html>
